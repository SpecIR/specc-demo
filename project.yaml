# SpecCompiler demo project — sw_docs model.
# Digital-clock firmware specification: the running example of the
# SpecCompiler dissertation. SRS/SDD/SVC/TRR plus SYMBOL objects
# extracted from C sources by scripts/extract_symbols.py (libclang).
#
# Suppressions disable sw_docs policies whose object types this demo
# does not use (SF, CSC allocation chains).

project:
  code: CLOCK
  name: "SpecCompiler demo: relógio digital"

template: sw_docs
output_dir: build/

doc_files:
  - srs.md
  - sdd.md
  - svc.md
  - tr.md

outputs:
  - format: html5
    path: www/{spec_id}.html
  - format: docx
    path: docx/{spec_id}.docx

html5:
  number_sections: true
  table_of_contents: true
  standalone: true
  embed_resources: true

validation:
  traceability_hlr_allocation: ignore
  traceability_fd_to_csc: ignore
  traceability_hlr_to_vc: error

logging:
  level: warn
  format: console
  color: true
