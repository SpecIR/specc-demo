# Build on every push and PR.
#
# - Pulls ghcr.io/specir/speccompiler:latest (bundles Lua, Pandoc,
#   PlantUML, and the sw_docs model).
# - Builds HTML and DOCX via the in-container specc entrypoint.
# - Uploads HTML, DOCX, and the SQLite IR as workflow artifacts.
# - On pushes to main AND on tag pushes: deploys HTML to GitHub Pages
#   (last deploy wins; the `pages` concurrency group serializes them).
# - On tag pushes: also creates a GitHub Release with the DOCX attached.

name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/specir/speccompiler:latest

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull SpecCompiler image
        run: docker pull "$IMAGE"

      - name: Build specs
        run: |
          rm -rf build
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            "$IMAGE" \
            build project.yaml

      - name: Upload HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: html
          path: build/www/
          if-no-files-found: error

      - name: Upload DOCX artifact
        uses: actions/upload-artifact@v4
        with:
          name: docx
          path: build/docx/
          if-no-files-found: error

      - name: Upload SpecIR database artifact
        uses: actions/upload-artifact@v4
        with:
          name: specir-db
          path: build/specir.db
          if-no-files-found: error

      - name: Stage Pages site (flatten figures into webroot)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        run: |
          rm -rf _site
          mkdir -p _site
          cp -r build/www/. _site/
          [ -d build/diagrams ] && cp -r build/diagrams _site/ || true
          [ -d build/charts ]   && cp -r build/charts   _site/ || true
          # SpecCompiler emits image refs as ../diagrams/ and ../charts/
          # (relative to www/). For Pages we serve from a flat root, so
          # rewrite the refs to be relative to the site root.
          find _site -maxdepth 1 -name '*.html' \
            -exec sed -i 's|\.\./diagrams/|diagrams/|g; s|\.\./charts/|charts/|g' {} +

      - name: Upload Pages artifact
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  deploy-pages:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download DOCX artifact
        uses: actions/download-artifact@v4
        with:
          name: docx
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.docx
          generate_release_notes: true
          fail_on_unmatched_files: true
